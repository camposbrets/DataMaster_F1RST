# =============================================
# CI/CD - Terraform (Infraestrutura como Codigo)
# =============================================
# Dispara apenas quando arquivos em infra/ mudam.
# Portoes obrigatorios: formatacao e validacao.
# Plan em pull request e apply em merge da main, opt-in via vars.
# =============================================

name: "Terraform - Infraestrutura"

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.7.0"
  WORKING_DIR: infra
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-checks:
    name: "Terraform format + validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=${{ vars.TF_STATE_PREFIX || 'terraform/state' }}"
          else
            terraform init -input=false -backend=false
          fi

      - name: Terraform Validate
        run: terraform validate

  terraform-plan:
    name: "Terraform plan"
    needs: terraform-checks
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autenticar no Google Cloud via WIF
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Terraform Init
        run: |
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=${{ vars.TF_STATE_PREFIX || 'terraform/state' }}"
          else
            terraform init -input=false -backend=false
          fi

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -lock=false

  terraform-apply:
    name: "Terraform apply"
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TERRAFORM_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autenticar no Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Terraform Init
        run: |
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=${{ vars.TF_STATE_PREFIX || 'terraform/state' }}"
          else
            terraform init -input=false -backend=false
          fi

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -lock=false
