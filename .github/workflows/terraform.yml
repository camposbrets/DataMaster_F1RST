# =============================================
# CI/CD - Terraform (Infraestrutura como Codigo)
# =============================================
# Dispara apenas quando arquivos em infra/ mudam.
# Portoes obrigatorios: formatacao e validacao (sem credenciais).
# Plan em pull request e apply em merge da main, opt-in via vars.
# Auth: Workload Identity Federation (WIF) — sem chave JSON.
# =============================================

name: "Terraform - Infraestrutura"

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.7.0"
  WORKING_DIR: infra
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-checks:
    name: "Terraform format + validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # init sem backend: valida sintaxe/refs sem precisar de credenciais nem do bucket de state
      - name: Terraform Init (sem backend)
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform-plan:
    name: "Terraform plan"
    needs: terraform-checks
    if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    env:
      # WIF e opt-in (default false p/ reproducao simples); o CI gerencia o WIF explicitamente.
      TF_VAR_github_actions_wif_enabled: "true"
      TF_VAR_github_repository: ${{ github.repository }}
      # Projeto/bucket parametrizados por Variables; fallback p/ os defaults do variables.tf
      # (sem fallback, uma Variable vazia sobrescreveria o default com "").
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'projeto-data-master' }}
      TF_VAR_gcs_bucket_name: ${{ vars.GCS_BUCKET || 'bruno_dm' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autenticar no Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX || 'terraform/state' }}"

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -lock=false

  terraform-apply:
    name: "Terraform apply"
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TERRAFORM_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      # WIF e opt-in (default false p/ reproducao simples); o CI gerencia o WIF explicitamente.
      TF_VAR_github_actions_wif_enabled: "true"
      TF_VAR_github_repository: ${{ github.repository }}
      # Projeto/bucket parametrizados por Variables; fallback p/ os defaults do variables.tf
      # (sem fallback, uma Variable vazia sobrescreveria o default com "").
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'projeto-data-master' }}
      TF_VAR_gcs_bucket_name: ${{ vars.GCS_BUCKET || 'bruno_dm' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autenticar no Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX || 'terraform/state' }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -lock=false
