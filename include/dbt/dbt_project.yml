name: 'capag'
version: '2.0.0'
config-version: 2

profile: 'capag'

models:
  capag:
    bronze:
      +materialized: incremental
      +incremental_strategy: insert_overwrite
      +schema: bronze
      +tags: ['bronze']
    silver:
      +materialized: table
      +schema: silver
      +tags: ['silver']
    gold:
      +materialized: table
      +schema: gold
      +tags: ['gold']

vars:
  project_id: "projeto-data-master"
  projeto_id: "projeto-data-master"
  incremental_lookback_years: 1
