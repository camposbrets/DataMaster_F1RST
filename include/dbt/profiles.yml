capag:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('DBT_GCP_KEYFILE', '/usr/local/airflow/include/gcp/service_account.json') }}"
      project: "{{ env_var('DBT_GCP_PROJECT_ID', 'projeto-data-master') }}"
      dataset: capag
      threads: 1
      timeout_seconds: 800
      location: US